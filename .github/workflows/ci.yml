name: CI

# 【原則】各ジョブはローカルと同一の make ターゲットを呼ぶ。
#   CI 側にだけ存在する検査を作らない。作った瞬間、ローカルの Green が
#   信用できなくなる。詳細は docs/harness/verification-loop.md。
#
# 【バージョン固定】ツールのバージョンは .devcontainer/Dockerfile と一致させること。
#   ずれると「ローカルで通るが CI で落ちる」が発生し、ハーネスの前提が壊れる。
#   Dockerfile 側を上げたら、ここも同時に上げる。

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

# 同一ブランチで新しい push があれば、進行中の実行を打ち切る
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1
  GOLANGCI_LINT_VERSION: 2.12.2
  TERRAFORM_VERSION: 1.15.8

jobs:
  # ---------------------------------------------------------------------------
  # Go: Lint / テスト / ドメイン層の依存検査
  # ---------------------------------------------------------------------------
  go:
    name: Go (lint / test / domain-deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # go.mod を単一の情報源にする。ここでバージョンを二重管理しない。
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum

      # golangci-lint は公式アクションを使わずバイナリを直接入れる。
      # アクションのメジャーバージョンと golangci-lint 本体のバージョン対応を
      # 追う必要がなくなり、Dockerfile と同一の固定方法で揃えられる。
      - name: Install golangci-lint ${{ env.GOLANGCI_LINT_VERSION }}
        run: |
          curl -fsSL -o /tmp/golangci-lint.tar.gz \
            "https://github.com/golangci/golangci-lint/releases/download/v${GOLANGCI_LINT_VERSION}/golangci-lint-${GOLANGCI_LINT_VERSION}-linux-amd64.tar.gz"
          tar -xzf /tmp/golangci-lint.tar.gz -C /tmp
          sudo mv "/tmp/golangci-lint-${GOLANGCI_LINT_VERSION}-linux-amd64/golangci-lint" /usr/local/bin/
          golangci-lint --version

      - name: make lint-api
        run: make lint-api

      - name: make test-api
        run: make test-api

      # ドメイン層がフレームワーク非依存であることの機械的検査。
      # この検査があるから「DDD でドメイン層を分離した」が主張ではなく事実になる。
      - name: make check-domain-deps
        run: make check-domain-deps

  # ---------------------------------------------------------------------------
  # Next.js: Lint / 型チェック / テスト
  #
  # apps/web はスキャフォールド済み（Issue #9）。package.json の不在を
  # SKIP で素通りさせない（docs/specs/web-app-scaffold.md AC-4-2 / AC-5-1）。
  # 本ジョブが呼ぶのは make lint-web / make test-web のみに保つ
  # （AC-5-5。CI 側にだけ存在する検査を作らない）。
  # ---------------------------------------------------------------------------
  web:
    name: Web (lint / test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: cd apps/web && npm ci

      - name: make lint-web
        run: make lint-web

      - name: make test-web
        run: make test-web

  # ---------------------------------------------------------------------------
  # .github/scripts / .claude/hooks のチェッカのロジック（fixture テスト）
  #
  # プロセス検査（spec-link / review-trail）の対象は PR のメタデータでローカルに
  # 存在しないが、チェッカのロジック自体は入力を差し替えればローカル実行できる。
  # そちらは通常のコード検査として make 経由で回す（CI 側にだけ作らない）。
  #
  # runner の既定 awk は mawk。ここが devcontainer と一致していることが前提で、
  # `#{1,6}` のような mawk が解釈しない ERE を入れた瞬間このジョブが落ちる。
  #
  # 【test-hooks を新規ジョブにせず本ジョブへ step 追加した理由（Issue #30 往復1
  #  C-2）】
  #   .claude/hooks は .github/scripts と対象種別が異なるため Makefile の
  #   ターゲットは test-scripts と test-hooks に分けている
  #   （docs/specs/orchestrator-entry-hook.md「対象」節）。しかし CI ジョブまで
  #   分けると、新規ジョブの `name:` を ruleset `protect-main` の必須チェックへ
  #   追加登録するブラウザ操作が人間に発生する（docs/harness/verification-loop.md
  #   「必須チェックへの登録」）。登録漏れがあると「実行され緑になるがマージ
  #   条件ではない」状態が生まれ、C-2 が問題視した「fixture が一度も走らない」
  #   状態より発見しにくい失敗モードになる。
  #   本ジョブは「fixture でチェッカのロジックを検査する」という性質が
  #   test-scripts と共通であり、make ターゲットは分けたまま同じジョブの
  #   step として追加すれば、既存の必須チェック名 `Scripts (checker logic)`
  #   を変更せずに済み、人間のブラウザ操作を発生させない。この判断により
  #   ruleset の追加登録は不要である。
  # ---------------------------------------------------------------------------
  scripts:
    name: Scripts (checker logic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # test-scripts は test-makefile-web.sh / test-apps-web-contract.sh を
      # 合流させている（docs/specs/web-app-scaffold.md AC-4-6 の制約で専用
      # ターゲットを新設できないため。理由は Makefile の test-scripts 直前の
      # コメント参照）。test-makefile-web.sh は実リポジトリの apps/web に対して
      # 実際に `make test-web` / `make lint-web`（npm test / npm run lint /
      # tsc）を実行するため、web ジョブと同じ Node セットアップと
      # apps/web の依存インストールが要る。node-version は P-2 により
      # .devcontainer/Dockerfile・web ジョブと同じ 24 に固定する。
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install apps/web dependencies (for test-scripts → test-makefile-web.sh)
        run: cd apps/web && npm ci

      # test-scripts は test-gitleaks-allowlist.sh も合流させている
      # （docs/specs/web-app-scaffold.md AC-11-6-e の制約で専用ターゲットを
      # 新設できないため）。動的検査のため gitleaks の実行バイナリが要る。
      # secrets ジョブと同じ導入手順・同じ GITLEAKS_VERSION を使い、
      # バージョン管理を二重化しない。
      - name: Install gitleaks ${{ env.GITLEAKS_VERSION }}
        run: |
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          sudo tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version

      - name: make test-scripts
        run: make test-scripts

      - name: make test-hooks
        run: make test-hooks

      # test-commands（.claude/scripts のチェッカ = /issue の機械判定部
      # issue-gate.sh の fixture）も、上と同じ理由で新規ジョブを起こさず
      # 本ジョブへ step を追加する。docs/specs/issue-command.md「対象」節
      # 「なぜ make ターゲットを分け、CI は既存ジョブへ相乗りさせるのか」参照。
      - name: make test-commands
        run: make test-commands

      # test-skills（.claude/scripts/check-skills.sh の fixture）と check-skills
      # （実 .claude/skills/*/SKILL.md の形式検査）も、上と同じ理由で新規ジョブを
      # 起こさず本ジョブへ step を追加する。ジョブ名 `Scripts (checker logic)` を
      # 変えないことで ruleset protect-main の必須チェック追加登録（ブラウザ操作）を
      # 発生させない。docs/specs/skills.md AC-5 / docs/harness/commands-and-skills.md。
      - name: make test-skills
        run: make test-skills

      - name: make check-skills
        run: make check-skills

      # test-go-module-pins（.github/scripts/check-go-module-pins.sh の fixture）と
      # check-go-module-pins（実 .devcontainer/Dockerfile ⇔ services/api/go.mod の
      # 整合検査）も、上と同じ理由で新規ジョブを起こさず本ジョブへ相乗りさせる。
      # このチェッカは go を使わない純粋なテキストフィルタなので（AC-5-3）、
      # setup-go は要らない。docs/specs/devcontainer-go-module-policy.md AC-9-3。
      - name: make test-go-module-pins
        run: make test-go-module-pins

      - name: make check-go-module-pins
        run: make check-go-module-pins

  # ---------------------------------------------------------------------------
  # シークレット検出
  # ---------------------------------------------------------------------------
  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # make scan-secrets は履歴も走査する。浅いクローンでは
          # 過去のコミットに混入したシークレットを見逃す。
          fetch-depth: 0

      - name: Install gitleaks ${{ env.GITLEAKS_VERSION }}
        run: |
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          sudo tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version

      - name: make scan-secrets
        run: make scan-secrets

  # ---------------------------------------------------------------------------
  # Terraform: 整形チェック / 検証
  # （infra/terraform に *.tf が無い間は make 側が SKIP を出す）
  # ---------------------------------------------------------------------------
  terraform:
    name: Terraform (fmt / validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          # make 側が素の terraform を呼ぶため、ラッパーを無効化する
          terraform_wrapper: false

      - name: make lint-tf
        run: make lint-tf

      - name: make test-tf
        run: make test-tf
