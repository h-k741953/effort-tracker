# gitleaks 8.30.1 設定。
# apps/web/.next 配下（Next.js のビルド生成物）のみを走査対象から除外する。
# 根拠・範囲の限界: docs/specs/web-app-scaffold.md AC-11。

[extend]
useDefault = true

[[allowlists]]
paths = ['''^apps/web/\.next/''']

# lambda-client.test.ts の 2-j（AWS 公開の SigV4 テストベクタの期待値）の Signature を
# generic-api-key が誤検知するため、この 1 件だけを除外する。根拠: docs/specs/web-app-scaffold.md AC-11-11。
[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
condition = "AND"
paths = ['''^apps/web/src/lib/lambda-client\.test\.ts$''']
regexes = ['''85d96828115b5dc0cfc3bd16ad9e210dd772bbebba041836c64533a82be05ead''']
